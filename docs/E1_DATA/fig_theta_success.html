  const tot=DATA.full[view].reduce((a,b)=>a+b.n,0);
  document.getElementById('ninfo').textContent=view==='all'?`${tot} 项`:`${tot} 项(去掉 45 个被前球物理遮挡的 trial)`;
  const NOTES={config:{all:'两个最低分箱里 68 项有 44 项是 4 m 站位上目标被前排球挡住的 trial,任何方法都答不了,所以曲线在 1° 以下被压到乱猜附近。切到「剔除物理遮挡」看方法本身的极限。',
    no_occ:'去掉物理遮挡后曲线基本单调:1.5° 以上接近全对,1° 到 1.5° 七到八成,1° 以下二十几项里 v2 与 v1 相当,会话连续自校准在 1 到 1.5° 多中 4 项、在 2.5 到 4° 少中 6 项(远卡偏置带进近卡的代价)。'},
    sigma:{all:'锥越宽越差,而且差在难档:σ=2.5° 在 1 到 2.5° 档掉 14 个点,σ=4° 掉 35 个点并开始伤及 2.5° 以上的易档。锥宽应等于标定精度,不是越宽越稳。像素角尺寸已随 σ 固定(1.5°/2.5°/4° 各用 33/55/89 像素),否则远处小球比一个像素还小。',
    no_occ:'剔除遮挡后同样单调:σ=1.5° 与 2.5° 在 1.5° 以上都接近全对,分歧集中在 1.5° 以下;σ=4° 从 4° 档起就开始掉,说明 4° 的锥在 2.5 到 4° 的邻距上已经把邻居收进来了。'}};
  document.getElementById('note').textContent=NOTES[mode][view];
  // table
  const t=document.createElement('table');const thead=document.createElement('thead');const tr=document.createElement('tr');
  for(const h of ['θ 分箱',...SERIES.map(s=>s[1])]){const th=document.createElement('th');th.textContent=h;tr.append(th);}thead.append(tr);t.append(thead);
  const tb=document.createElement('tbody');
  BINS.forEach((b,i)=>{const r=document.createElement('tr');const td0=document.createElement('td');td0.textContent=`${b[0]}–${b[1]>=20?'∞':b[1]}°`;r.append(td0);
    for(const [cfg] of SERIES){const d=DATA[cfg][view][i];const td=document.createElement('td');td.textContent=d.n?`${d.hit}/${d.n} (${Math.round(d.rate*100)}%)`:'—';r.append(td);}tb.append(r);});
  t.append(tb);const tw=document.getElementById('table');tw.textContent='';tw.append(t);
  // hover
  const tip=document.getElementById('tip'),cross=document.getElementById('cross'),card=document.querySelector('.card');
  const show=(i,ev)=>{const b=BINS[i];tip.textContent='';const h=document.createElement('div');h.className='h';h.textContent=`θ ${b[0]}–${b[1]>=20?'∞':b[1]}°`;tip.append(h);
    for(const [cfg,name,slot] of SERIES){const d=DATA[cfg][view][i];const r=document.createElement('div');r.className='r';const l=document.createElement('span');const ic=document.createElement('i');ic.style.borderTopColor=css('--'+slot);l.append(ic,document.createTextNode(name));const v=document.createElement('span');v.textContent=d.n?`${d.hit}/${d.n} = ${Math.round(d.rate*100)}%  [${Math.round(d.ci[0]*100)}–${Math.round(d.ci[1]*100)}]`:'—';r.append(l,v);tip.append(r);}
    cross.setAttribute('x1',px(i));cross.setAttribute('x2',px(i));cross.style.display='';
    const rect=card.getBoundingClientRect();const svgEl=document.querySelector('#chart svg');const sr=svgEl.getBoundingClientRect();
    const cx=sr.left-rect.left+px(i)*sr.width/W;tip.style.display='block';const tw2=tip.offsetWidth;tip.style.left=Math.min(Math.max(8,cx-tw2/2),rect.width-tw2-8)+'px';tip.style.top=(sr.top-rect.top+MT*sr.height/H+8)+'px';};
  const hide=()=>{tip.style.display='none';cross.style.display='none';};
  document.querySelectorAll('.hit').forEach(el=>{const i=+el.dataset.i;el.addEventListener('pointermove',e=>show(i,e));el.addEventListener('pointerleave',hide);el.addEventListener('focus',e=>show(i,e));el.addEventListener('blur',hide);});
}
document.getElementById('m-config').onclick=()=>{mode='config';SERIES=MODES[mode];document.getElementById('m-config').setAttribute('aria-pressed','true');document.getElementById('m-sigma').setAttribute('aria-pressed','false');render();};
document.getElementById('m-sigma').onclick=()=>{mode='sigma';SERIES=MODES[mode];document.getElementById('m-sigma').setAttribute('aria-pressed','true');document.getElementById('m-config').setAttribute('aria-pressed','false');render();};
document.getElementById('b-all').onclick=()=>{view='all';document.getElementById('b-all').setAttribute('aria-pressed','true');document.getElementById('b-noocc').setAttribute('aria-pressed','false');render();};
document.getElementById('b-noocc').onclick=()=>{view='no_occ';document.getElementById('b-noocc').setAttribute('aria-pressed','true');document.getElementById('b-all').setAttribute('aria-pressed','false');render();};
render();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
</script>
